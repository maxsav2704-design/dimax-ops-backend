name: Backend Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "requirements-audit.txt"
      - "constraints.txt"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".env.example"
      - ".env.production.example"
      - "pytest.ini"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "requirements-audit.txt"
      - "constraints.txt"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".env.example"
      - ".env.production.example"
      - "pytest.ini"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository boundary
        run: python scripts/verify_repo_boundary.py

  backup-restore-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start db
        run: docker compose up -d db

      - name: Apply migrations
        run: docker compose run --rm --no-deps api alembic upgrade head

      - name: Backup/restore smoke
        run: python scripts/db_backup_restore_smoke.py

      - name: Teardown
        if: always()
        run: docker compose down -v

  architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Run architecture and security contract tests
        run: >
          docker compose run --rm --no-deps api pytest -q
          tests/architecture
          tests/test_security_hashes.py

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Run OpenAPI contract tests
        run: docker compose run --rm --no-deps api pytest -q tests/integration/test_openapi_contract.py

  error-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start database
        run: docker compose up -d --wait db

      - name: Apply migrations
        run: docker compose run --rm --no-deps api alembic upgrade head

      - name: Run error envelope contract tests
        run: >
          docker compose run --rm --no-deps api pytest -q
          tests/integration/test_auth_guards_api.py
          tests/integration/test_admin_access_and_validation.py
          tests/integration/test_installers_link_user_api.py
          tests/integration/test_installer_rates_api.py

      - name: Teardown
        if: always()
        run: docker compose down -v

  integration:
    runs-on: ubuntu-latest
    # Both the focused financial regressions and full suite must finish on slower runners.
    timeout-minutes: 45
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dimax_acceptance_tests
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dimax_acceptance_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start dependencies
        # tests/conftest.py supplies in-memory storage; real MinIO/Mailpit acceptance is opt-in.
        run: docker compose up -d --wait db

      - name: Create isolated test database
        run: docker compose exec -T db createdb -U postgres dimax_acceptance_tests

      - name: Apply migrations
        run: >
          docker compose run --rm --no-deps
          -e APP_ENV -e DATABASE_URL -e TEST_DATABASE_URL
          api alembic upgrade head

      - name: Run offline price authority regressions
        run: >
          docker compose run --rm --no-deps
          -e APP_ENV -e DATABASE_URL -e TEST_DATABASE_URL
          api pytest -q -p no:cacheprovider --maxfail=1
          tests/integration/test_work_price_approvals.py
          tests/integration/test_work_price_proposals.py
          tests/integration/test_offline_execution_authority.py
          tests/integration/test_execution_time_correction.py
          tests/integration/test_factory_earnings.py
          tests/integration/test_factory_price_timeline.py
          tests/integration/test_factory_price_sync.py
          tests/integration/test_factory_price_activation_api.py
          tests/integration/test_factory_price_review.py
          tests/integration/test_price_conflict_resolution.py

      - name: Run integration tests
        run: >
          docker compose run --rm --no-deps
          -e APP_ENV -e DATABASE_URL -e TEST_DATABASE_URL
          api pytest -q -p no:cacheprovider tests/integration

      - name: Teardown
        if: always()
        run: docker compose down -v

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start dependencies
        run: docker compose up -d db

      - name: Upgrade to head
        run: docker compose run --rm --no-deps api alembic upgrade head

      - name: Downgrade to base
        run: docker compose run --rm --no-deps api alembic downgrade base

      - name: Upgrade to head again
        run: docker compose run --rm --no-deps api alembic upgrade head

      - name: Legacy product library upgrade and downgrade smoke
        run: >
          docker compose run --rm --no-deps
          -e DIMAX_LEGACY_MIGRATION_SMOKE=1
          api python scripts/db_legacy_product_library_migration_smoke.py

      - name: Create isolated offline-evidence migration database
        id: offline-evidence-db
        run: docker compose exec -T db createdb -U postgres dimax_offline_evidence_migration_tests

      - name: Historical offline evidence migration and rollback guards
        run: >
          docker compose run --rm --no-deps
          -e APP_ENV=test
          -e DIMAX_OFFLINE_EVIDENCE_MIGRATION=1
          -e DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/dimax_offline_evidence_migration_tests
          -e "PGOPTIONS=-c statement_timeout=30000 -c lock_timeout=5000"
          api python -m scripts.db_offline_evidence_migration_smoke

      - name: Remove owned offline-evidence migration database
        if: always() && steps.offline-evidence-db.outcome == 'success'
        run: docker compose exec -T db dropdb -U postgres dimax_offline_evidence_migration_tests

      - name: Teardown
        if: always()
        run: docker compose down -v

  quality-gate:
    runs-on: ubuntu-latest
    needs:
      - repo-boundary
      - backup-restore-smoke
      - architecture-contract
      - api-contract
      - error-contract
      - integration
      - migration-smoke
    if: always()
    steps:
      - name: Enforce required checks
        run: |
          echo "repo-boundary: ${{ needs['repo-boundary'].result }}"
          echo "backup-restore-smoke: ${{ needs['backup-restore-smoke'].result }}"
          echo "architecture-contract: ${{ needs['architecture-contract'].result }}"
          echo "api-contract: ${{ needs['api-contract'].result }}"
          echo "error-contract: ${{ needs['error-contract'].result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "migration-smoke: ${{ needs['migration-smoke'].result }}"
          if [ "${{ needs['repo-boundary'].result }}" != "success" ] || [ "${{ needs['backup-restore-smoke'].result }}" != "success" ] || [ "${{ needs['architecture-contract'].result }}" != "success" ] || [ "${{ needs['api-contract'].result }}" != "success" ] || [ "${{ needs['error-contract'].result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs['migration-smoke'].result }}" != "success" ]; then
            echo "Quality gate failed"
            exit 1
          fi
          echo "Quality gate passed"
