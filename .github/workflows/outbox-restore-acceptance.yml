name: Restored Outbox Acceptance

on:
  workflow_dispatch:
  push:
    branches: [codex/outbox-recovery-20261024]
    paths:
      - .github/workflows/outbox-restore-acceptance.yml
      - scripts/outbox_restore_probe.py
      - scripts/full_restore_probe.py
      - scripts/test_full_restore_acceptance.py
      - tests/test_outbox_restore_safety.py

permissions:
  contents: read

concurrency:
  group: outbox-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: maxsav2704-design/dimax-ops-workspace
          ref: 971cc0ff5bf1af58cc3823aab4159adc399400d4
          path: recovery-infra
          sparse-checkout: infra/minio
      - name: Safety tests
        run: python -B -m unittest discover -s tests -p 'test_*restore_safety.py' -v
      - name: Build isolated runtime images
        run: |
          docker pull postgres:16.12-alpine
          docker build -t dimax-recovery-app .
          docker build --target server -t dimax-recovery-storage -f recovery-infra/infra/minio/Dockerfile recovery-infra/infra/minio
      - name: Restore and resume synthetic outbox
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/test_full_restore_acceptance.py --resume-outbox \
            --postgres-image "$(docker image inspect postgres:16.12-alpine --format '{{.Id}}')" \
            --app-image "$(docker image inspect dimax-recovery-app --format '{{.Id}}')" \
            --storage-image "$(docker image inspect dimax-recovery-storage --format '{{.Id}}')" \
            2>&1 | tee outbox-recovery.log
      - name: Publish synthetic execution log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbox-recovery-log
          path: outbox-recovery.log
          if-no-files-found: ignore
          retention-days: 7
